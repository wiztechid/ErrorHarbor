name: PR16 Source Snapshot for Local Regression

# Small, one-shot source export to permit iterative mobile debugging locally
# without repeatedly consuming heavy browser GitHub Actions runs.
on:
  push:
    branches: [docs/wiz-github-mode-hemat-sop]
    paths:
      - '.github/workflows/pr16-source-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Pack public PR checkout source for off-runner regression
        run: tar --exclude='./.git' --exclude='./node_modules' -czf /tmp/pr16-checkout.tar.gz .
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: errorharbor-pr16-checkout
          path: /tmp/pr16-checkout.tar.gz
          retention-days: 1
