name: SEO Link Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-seo-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate publication graph
        run: node scripts/validate-publish.mjs
