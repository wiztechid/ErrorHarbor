<path d="M4 105C12 91 22 77 34 75C45 73 54 82 64 88L54 124H22C12 119 7 113 4 105Z" fill="url(#badge)"/>
<g fill="none" stroke="#fff" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
