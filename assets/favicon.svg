<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="ErrorHarbor">
<defs>
 <linearGradient id="bg" x1="13" y1="8" x2="116" y2="121" gradientUnits="userSpaceOnUse"><stop stop-color="#2b9af2"/><stop offset=".32" stop-color="#1260e2"/><stop offset=".68" stop-color="#1737c5"/><stop offset="1" stop-color="#6842f1"/></linearGradient>
 <linearGradient id="hh" x1="75" y1="33" x2="103" y2="96" gradientUnits="userSpaceOnUse"><stop stop-color="#32baff"/><stop offset="1" stop-color="#188ce9"/></linearGradient>
 <linearGradient id="badge" x1="10" y1="82" x2="65" y2="121" gradientUnits="userSpaceOnUse"><stop stop-color="#2c72ef"/><stop offset="1" stop-color="#1538c9"/></linearGradient>
 <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.25" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
<!-- broad reference diagonal / deep upper-right field -->
<path d="M78 4H124V52L91 82H58L78 4Z" fill="#09299f" opacity=".96"/>
<!-- lower-right violet depth -->
<path d="M58 82H91L124 52V124H47Z" fill="#2636c9" opacity=".42"/>
