<path d="M24 30H70V45H41V57H66V70H41V84H70V99H24V30Z" fill="#fff" filter="url(#soft)"/>
<!-- H: broad cyan, with strong stems -->
<path d="M68 30H84V57H101V30H117V99H101V72H84V99H68V30Z" fill="url(#hh)" filter="url(#soft)"/>
<!-- diagonal overlays upper-left of H like master -->
<path d="M78 4H105L68 58V43Z" fill="#1037ba" opacity=".96"/>
