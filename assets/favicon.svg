<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="ErrorHarbor EH terminal monogram">
<defs>
 <linearGradient id="bg" x1="13" y1="10" x2="112" y2="120" gradientUnits="userSpaceOnUse"><stop stop-color="#1681f5"/><stop offset=".43" stop-color="#164bd7"/><stop offset=".76" stop-color="#2434c7"/><stop offset="1" stop-color="#7240f2"/></linearGradient>
 <linearGradient id="h" x1="68" y1="34" x2="105" y2="96" gradientUnits="userSpaceOnUse"><stop stop-color="#32b9ff"/><stop offset="1" stop-color="#1787ef"/></linearGradient>
 <linearGradient id="lower" x1="12" y1="75" x2="94" y2="126" gradientUnits="userSpaceOnUse"><stop stop-color="#3169ef"/><stop offset="1" stop-color="#3426c4"/></linearGradient>
 <filter id="glow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="1.7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="5" y="5" width="118" height="118" rx="30" fill="url(#bg)"/>
<!-- upper-right deep diagonal plane -->
<path d="M83 5H123V48L91 80H62L83 5Z" fill="#082d9d" opacity=".92"/>
<!-- lower-left layered plane -->
<path d="M5 86L37 61L67 80L44 123H5Z" fill="url(#lower)" opacity=".72"/>
<!-- subtle lower violet plane -->
<path d="M43 123L67 80L94 97L123 72V123Z" fill="#4630d8" opacity=".28"/>
<!-- E: tall, broad, reference-like -->
<path d="M27 30H70V44H43V57H66V70H43V85H70V99H27V30Z" fill="#fff" filter="url(#glow)"/>
<!-- H overlaps E -->
<path d="M68 31H83V57H101V31H116V99H101V72H83V99H68V31Z" fill="url(#h)" filter="url(#glow)"/>
<!-- terminal prompt intentionally large and anchored bottom-left -->
<g fill="none" stroke="#fff" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
 <path d="M20 94L33 105L20 116"/>
 <path d="M44 116H62"/>
</g>
</svg>