<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ErrorHarbor — Favicon Prototype</title>
<style>
:root{--r:30px;--white:#fff;--cyan:#25b9ff;--blue:#177cf2;--royal:#1848d5;--navy:#082d9d;--violet:#7040ef}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f8fc;color:#14213d;font:15px/1.5 Inter,system-ui,sans-serif}
.board{width:min(920px,calc(100% - 32px));padding:32px;background:#fff;border:1px solid #e3e9f2;border-radius:28px;box-shadow:0 20px 60px #203c6514}
h1{margin:0 0 4px;font-size:26px}.sub{margin:0 0 26px;color:#718096}.row{display:flex;align-items:end;gap:28px;flex-wrap:wrap}.sample{display:grid;gap:8px;color:#718096;font-size:12px;font-weight:700}
.mark{--s:128px;position:relative;width:var(--s);height:var(--s);border-radius:calc(var(--s)*.235);overflow:hidden;background:linear-gradient(145deg,var(--blue) 0%,var(--royal) 46%,#2935c9 75%,var(--violet) 100%);box-shadow:0 calc(var(--s)*.08) calc(var(--s)*.2) #1848d529}
.mark:before{content:"";position:absolute;left:64%;top:-8%;width:58%;height:72%;background:var(--navy);opacity:.92;transform:skewX(-35deg);transform-origin:top}
.mark:after{content:"";position:absolute;left:-15%;bottom:-10%;width:75%;height:55%;background:linear-gradient(135deg,#3472f1,#3426c4);opacity:.68;transform:skewX(-30deg)}
.e,.h,.prompt{position:absolute;z-index:2;filter:drop-shadow(0 1px 1px #001f6240)}
.e{left:21%;top:23%;width:35%;height:55%}.e i{position:absolute;left:0;width:100%;height:20%;background:#fff;border-radius:calc(var(--s)*.012)}.e i:nth-child(1){top:0}.e i:nth-child(2){top:40%;width:87%}.e i:nth-child(3){bottom:0}.e b{position:absolute;left:0;top:0;width:25%;height:100%;background:#fff;border-radius:calc(var(--s)*.012)}
.h{left:52%;top:23%;width:38%;height:55%}.h:before,.h:after,.h i{content:"";position:absolute;background:linear-gradient(180deg,#35c1ff,#1687ed);border-radius:calc(var(--s)*.012)}.h:before{left:0;top:0;width:25%;height:100%}.h:after{right:0;top:0;width:25%;height:100%}.h i{left:18%;top:40%;width:64%;height:20%}
.prompt{left:15%;bottom:9%;display:flex;align-items:end;gap:calc(var(--s)*.075);color:#fff}.chev{width:calc(var(--s)*.14);height:calc(var(--s)*.14);border-right:calc(var(--s)*.065) solid #fff;border-top:calc(var(--s)*.065) solid #fff;transform:rotate(45deg)}.under{width:calc(var(--s)*.15);height:calc(var(--s)*.065);background:#fff;border-radius:99px}
.s128{--s:128px}.s64{--s:64px}.s32{--s:32px}.s16{--s:16px}
.wordmark{display:flex;align-items:center;gap:14px;margin-top:30px;font-size:30px;font-weight:900;letter-spacing:-.04em}.wordmark .mark{--s:54px}.tag{margin-left:68px;margin-top:-5px;color:#66758b}
@media(max-width:600px){.board{padding:22px}.row{gap:18px}.wordmark{font-size:24px}}
</style></head><body><main class="board"><h1>ErrorHarbor EH — HTML master prototype</h1><p class="sub">Visual master for geometry, layers and small-size legibility before rebuilding the canonical SVG.</p>
<div class="row">
<div class="sample"><div class="mark s128"><div class="e"><b></b><i></i><i></i><i></i></div><div class="h"><i></i></div><div class="prompt"><span class="chev"></span><span class="under"></span></div></div>128 px</div>
<div class="sample"><div class="mark s64"><div class="e"><b></b><i></i><i></i><i></i></div><div class="h"><i></i></div><div class="prompt"><span class="chev"></span><span class="under"></span></div></div>64 px</div>
<div class="sample"><div class="mark s32"><div class="e"><b></b><i></i><i></i><i></i></div><div class="h"><i></i></div><div class="prompt"><span class="chev"></span><span class="under"></span></div></div>32 px</div>
<div class="sample"><div class="mark s16"><div class="e"><b></b><i></i><i></i><i></i></div><div class="h"><i></i></div><div class="prompt"><span class="chev"></span><span class="under"></span></div></div>16 px</div>
</div>
<div class="wordmark"><div class="mark"><div class="e"><b></b><i></i><i></i><i></i></div><div class="h"><i></i></div><div class="prompt"><span class="chev"></span><span class="under"></span></div></div><span>ErrorHarbor</span></div>
<div class="tag">Exact-error troubleshooting. Safer fixes. Clear verification.</div>
</main></body></html>
